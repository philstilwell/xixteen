name: Verify XiXteen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check the site before publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify source, pages, saved sessions, and schedule
        run: npm run check
      - name: Verify generated files are committed
        run: git diff --exit-code
